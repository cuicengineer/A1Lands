<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A-1 Lands Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Poppins -->
<link href="assets/fonts/custom-fonts.css" rel="stylesheet">
<!-- FA Icons -->
<link href="assets/css/all.min.css" rel="stylesheet">

<link href="assets/css/style.css" rel="stylesheet">

</head>
<body>

<div class="slider">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="bg-overlay"></div>
</div>

<div class="page">
    
    <div class="left-side">
        <div class="login-card">
            <div class="brand">
                <div class=""><img class="logo-symb" src="assets/img/PAF-Logo.gif"></div>
                <div class="brand-text">
                    <h2>A-1 lands</h2>
                    <small>Sub Heading</small>
                </div>
            </div>

            <div class="welcome-section">
                <h3>Welcome Text Here</h3>
                <p>Sub Text Here</p>
            </div>

            <div class="field-group">
                <label>User Name</label>
                <input type="text" class="input-underline" placeholder="Enter User Name">
            </div>

            <div class="field-group">
                <label>Password</label>
                <input type="password" class="input-underline" placeholder="Enter your password">
            </div>

            <button class="btn-signin">
                Sign In <i class="fa-solid fa-arrow-right-long" style="transform: rotate(-45deg);"></i>
            </button>
        </div>
    </div>

    <div class="right-side">
        <div class="hex-grid">
            <div class="hex-col c1">
                <div class="hex-box">
                    <i class="fa-solid fa-map"></i>
                    <span>Plots</span>
                </div>
            </div>

            <div class="hex-col c2">
                <div class="hex-box">
                    <i class="fa-solid fa-gas-pump"></i>
                    <span>Petrol Station</span>
                </div>
                <div class="hex-box">
                    <i class="fa-solid fa-building"></i>
                    <span>Towers</span>
                </div>
            </div>

            <div class="hex-col c3">
                <div class="hex-box">
                    <i class="fa-solid fa-rectangle-ad"></i>
                    <span>Billboards</span>
                </div>
                <div class="hex-box">
                    <i class="fa-solid fa-store"></i>
                    <span>Shopping Malls</span>
                </div>
                <div class="hex-box">
                    <i class="fa-solid fa-tractor"></i>
                    <span>Agri Lands</span>
                </div>
            </div>

            <div class="hex-col c4">
                <div class="hex-box blank"></div>
                <div class="hex-box blank"></div>
                <div class="hex-box blank"></div>
                <div class="hex-box blank"></div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
